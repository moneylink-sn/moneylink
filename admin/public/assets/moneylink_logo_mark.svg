<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="mkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E59B" />
      <stop offset="40%" stop-color="#00A86B" />
      <stop offset="100%" stop-color="#00683F" />
    </linearGradient>
    <linearGradient id="mkBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>
    <filter id="mkShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00A86B" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fond avec ombre et dégradé émeraude -->
  <rect x="20" y="20" width="216" height="216" rx="60" fill="url(#mkGrad)" filter="url(#mkShadow)" />
  <rect x="20" y="20" width="216" height="216" rx="60" fill="none" stroke="url(#mkBorder)" stroke-width="3" />

  <!-- Monogramme MK Géométrique & FinTech -->
  <g fill="#FFFFFF">
    <!-- Lettre M -->
    <path d="M64 176 V80 h22 l22 46 22-46 h22 v96 h-20 v-62 l-18 38 h-12 l-18-38 v62 Z" />
    <!-- Lettre K intégrée et stylisée -->
    <path d="M158 80 h22 v38 l26-38 h24 l-32 44 34 52 h-26 l-24-38 v38 h-22 Z" />
  </g>

  <!-- Puce / Nœud de confiance technologique -->
  <circle cx="196" cy="74" r="7" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2" />
</svg>